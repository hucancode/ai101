<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 — Parameterized Primitives</title>
  <style>
    html, body { margin: 0; height: 100%; background: #11141a; }
    #view { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: fixed; left: 12px; top: 12px; width: 280px;
      color: #cdd3de; font: 13px monospace;
      background: #1a1f28cc; padding: 12px; border-radius: 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #params { display: flex; flex-direction: column; gap: 6px; }
    #params label { display: flex; align-items: center; gap: 6px; }
    #params input[type=range] { flex: 1; }
    #params span { min-width: 4ch; text-align: right; }
    #readout { border-top: 1px solid #333c4a; padding-top: 8px; line-height: 1.5; word-break: break-all; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <select id="prim"></select>
    <div id="params"></div>
    <div id="readout">
      id: <span id="id"></span>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
