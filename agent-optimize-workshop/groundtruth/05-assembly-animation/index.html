<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 — Assembly Animation</title>
  <style>
    html, body { margin: 0; height: 100%; background: #11141a; }
    #view { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: fixed; left: 12px; bottom: 12px; display: flex; gap: 10px;
      align-items: center; color: #cdd3de; font: 13px monospace;
      background: #1a1f28cc; padding: 8px 12px; border-radius: 8px;
    }
    #u { width: 280px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <button id="play">▶ auto</button>
    <input id="u" type="range" min="0" max="1" step="0.001" value="0" />
    <span>u = <span id="uv">0.000</span></span>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
