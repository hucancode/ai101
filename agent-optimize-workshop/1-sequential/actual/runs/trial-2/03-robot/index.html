<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Joints — gallery</title>
<style>
  html, body { margin: 0; height: 100%; background: #11141a; overflow: hidden; }
  /* Canvas owns the viewport: fixed, full-bleed, sized from its own box —
     never a flex sibling of the panel, or render.js's clientWidth-driven
     resize() would grow it every frame against the panel's fixed width. */
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Panel floats over the canvas, does not participate in canvas layout. */
  #panel {
    position: fixed; top: 12px; left: 12px; width: 280px;
    padding: 12px 14px; box-sizing: border-box;
    background: rgba(20, 23, 30, 0.88); border: 1px solid #2b3040; border-radius: 8px;
    color: #dfe3ea; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    backdrop-filter: blur(4px); pointer-events: none;
  }
  #panel h1 { font-size: 13px; margin: 0 0 8px; color: #8fa3ff; letter-spacing: 0.02em; }
  #panel .row { display: flex; justify-content: space-between; gap: 10px; margin: 3px 0; color: #b6c0d6; }
  #panel .row b { color: #dfe3ea; font-weight: 600; }
  #panel .note { margin-top: 10px; border-top: 1px solid #2b3040; padding-top: 8px; color: #6b7590; }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <h1>JOINTS — GALLERY</h1>
    <div class="row"><b>hinge1</b><span>swing</span></div>
    <div class="row"><b>hinge2</b><span>rx, rz</span></div>
    <div class="row"><b>ball1</b><span>rx, ry, rz</span></div>
    <div class="note">mount-to-mount hinge: exported for consumers, not shown here</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
