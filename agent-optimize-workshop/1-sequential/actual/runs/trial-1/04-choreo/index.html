<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 — Choreographer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #11141a; overflow: hidden; }
    #view { width: 100%; height: 100%; display: block; touch-action: none; }

    /* the panel floats OVER the canvas (position: fixed) rather than sharing
       a flex row with it, so it never shrinks the canvas's clientWidth. */
    #panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 240px;
      overflow-y: auto; box-sizing: border-box; padding: 14px 16px;
      background: rgba(15, 18, 24, 0.78); backdrop-filter: blur(6px);
      font: 12px/1.4 system-ui, sans-serif; color: #cfd6e4;
      pointer-events: auto;
    }
    #panel .row {
      display: grid; grid-template-columns: 74px 1fr 38px; align-items: center;
      gap: 8px; margin-bottom: 8px;
    }
    #panel .name { color: #8b93a7; text-transform: capitalize; }
    #panel .val { text-align: right; font-variant-numeric: tabular-nums; }
    #panel input[type="range"] { width: 100%; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
