<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engines — joint demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #11141a; }
    #view { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: fixed; left: 12px; top: 12px; width: 320px; max-height: calc(100% - 24px);
      overflow-y: auto; color: #cdd3de; font: 13px monospace;
      background: #1a1f28cc; padding: 12px; border-radius: 8px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    #tabs .grouplabel { opacity: 0.6; margin-right: 2px; }
    #tabs .grouplabel:not(:first-child) { margin-left: 6px; }
    #tabs button {
      background: #2a3240; color: #cdd3de; border: 1px solid #3a4456;
      border-radius: 5px; padding: 3px 9px; font: 12px monospace; cursor: pointer;
    }
    #tabs button:hover { background: #38445a; }
    #caption { opacity: 0.85; line-height: 1.4; }
    #params { display: flex; flex-direction: column; gap: 6px; }
    #params label { display: flex; align-items: center; gap: 6px; }
    #params input[type=range] { flex: 1; }
    #params span { min-width: 4ch; text-align: right; }
    .legend { display: flex; flex-direction: column; gap: 2px; opacity: 0.8; }
    .legend b { font-weight: normal; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <div id="tabs"></div>
    <div id="caption"></div>
    <div class="legend">
      <b><span style="color:#e64033">f</span> forward · <span style="color:#4dd94d">b</span> bitangent · <span style="color:#4d80f2">n</span> normal</b>
      <b><span style="color:#e64dd9">◆</span> male mount · <span style="color:#4dccd9">◆</span> female mount · <span style="color:#f2f2f2">◻</span> origin</b>
    </div>
    <div id="params"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
