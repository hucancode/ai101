<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>engine demo</title>
    <style>
      :root {
        --bg: #11141a;
        --panel: #171b23;
        --line: #272d39;
        --ink: #d7dce5;
        --dim: #8a93a3;
        --accent: #7dcb2f;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-columns: 1fr 320px;
        grid-template-rows: auto 1fr;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      /* tab bar — grouped by subject kind. Each engine adds its own groups. */
      #tabs {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .tab-group { display: flex; align-items: center; gap: 6px; }
      .tab-group > .kind {
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #222836;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover { border-color: #3b4557; }
      button.on { background: var(--accent); border-color: var(--accent); color: #10140c; }

      #view { width: 100%; height: 100%; display: block; }

      #side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      #caption {
        padding: 10px 12px;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
      }

      /* choreo engine: play/pause transport over the active subject's sliders */
      #transport {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      #transport .grow { flex: 1; }
      #beat { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }

      #sliders { overflow-y: auto; padding: 6px 12px 20px; }
      .row { padding: 5px 0; }
      .row label {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 11px;
      }
      .row .val { font-variant-numeric: tabular-nums; }
      .row.driven label { color: var(--accent); }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <nav id="tabs"></nav>
    <canvas id="view"></canvas>
    <aside id="side">
      <div id="caption"></div>
      <!-- choreo engine -->
      <div id="transport">
        <button id="play">play</button>
        <span class="grow">
          <input id="period" type="range" min="0.4" max="3" step="0.05" value="1.6" />
        </span>
        <span id="beat">idle</span>
      </div>
      <div id="sliders"></div>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
